name: online-scan

# 节点源扫描 —— 聚焦高质量协议节点（vless / hysteria2）
#
# 【战略调整 2026-10】
#   主流程只处理「用户订阅节点」：vless / vmess / trojan / hysteria2
#   HTTP/SOCKS 代理池不再进主流程（客户端不支持导入，对用户无意义）
#
#   代码保留：
#     - scripts/online/scrape.py      仍抓 pool-urls.txt（受 SCOPE 开关控制）
#     - scripts/online/light_check.py 仍可用（受 SCOPE 开关控制）
#   若将来要恢复代理池流程，把 SCOPE 切回 "all" 即可。

on:
  schedule:
    # every 2 hours — Actions cron is UTC, may delay
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: "nodes = 只处理订阅节点 | all = 兼顾 HTTP/SOCKS 池"
        required: true
        default: nodes
        type: choice
        options:
          - nodes
          - all
  push:
    paths:
      - "sources/**"
  # 注意：本工作流本身就是链条起点，不需要 workflow_run 依赖
      - "scripts/online/**"
      - ".github/workflows/online-scan.yml"

concurrency:
  group: online-scan
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve scope
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.scope }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=nodes" >> "$GITHUB_OUTPUT"   # 定时任务默认只跑节点
          fi

      - name: Mirror node sources + dedupe + TG previews
        env:
          SCOPE: ${{ steps.scope.outputs.value }}
        run: |
          echo "scope=$SCOPE"
          # SCOPE=nodes 时，scrape.py 通过环境变量跳过 pool 抓取
          python scripts/online/scrape.py

      - name: Build Clash feed from node sources
        env:
          # ⚠️ 关键：0 = 不限量
          #   原来默认 180 → 3583 个抓取节点只转出 182 个（丢失 95%）
          MAX_PROXIES: "0"
        run: |
          set -e
          echo "── 抓取 URI 数 ──"
          wc -l dist/online/nodes.txt || true

          # ① 全量转换：URI → Clash
          if [ -f scripts/online/nodes_to_clash.py ]; then
            echo "── 全量转换 nodes_to_clash（MAX_PROXIES=0）──"
            MAX_PROXIES=0 python scripts/online/nodes_to_clash.py || echo "nodes_to_clash 失败"
            echo "  产出 $(grep -c '^  - name:' dist/online/clash.yaml 2>/dev/null || echo 0) 个节点"
          fi

          # ② 补充：精选 feeds（仅当全量产出不足时）
          N=$(grep -c '^  - name:' dist/online/clash.yaml 2>/dev/null || echo 0)
          if [ "$N" -lt 100 ] && [ -f scripts/online/build_clash_from_feeds.py ]; then
            echo "── 全量产出不足（$N），补充精选 feeds ──"
            MAX_PROXIES=0 python scripts/online/build_clash_from_feeds.py || echo "feeds 失败"
          fi

          FINAL=$(grep -c '^  - name:' dist/online/clash.yaml 2>/dev/null || echo 0)
          echo "── 最终 clash.yaml: $FINAL 个节点 ──"
          if [ "$FINAL" -lt 50 ]; then
            echo "::warning::转换产出仅 $FINAL 个"
          fi

      - name: Light HTTP sample check (pool only — skipped in nodes scope)
        if: ${{ steps.scope.outputs.value == 'all' }}
        run: python scripts/online/light_check.py --sample 400 --workers 50 --timeout 6
        continue-on-error: true

      - name: Commit dist/online
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p dist/online
          git add dist/online
          if git diff --staged --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "chore(online): refresh scrape [$(date -u +%Y-%m-%dT%H:%M:%SZ)]"

          # ⚠️ dist/ 是机器生成的数据，冲突时应以【本次生成】为准
          #    原来的 `git rebase origin/main` 遇到冲突会直接失败
          #    改为：-X theirs（本地提交优先）+ 失败重试
          for i in 1 2 3 4 5; do
            echo "── push 尝试 $i ──"
            git fetch origin main
            if git rebase -X theirs origin/main 2>/dev/null; then
              if git push origin HEAD:main; then
                echo "✅ 推送成功"
                exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
              echo "  rebase 冲突，等待后重试"
            fi
            sleep 5
          done

          echo "::warning::5 次推送均失败（可能与其他工作流竞争），下次定时会补上"
          exit 0

      - name: Sync dist/online to R2
        if: ${{ success() }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "R2 secrets not configured — skipping sync"
            exit 0
          fi
          aws s3 sync dist/online/ "s3://proxy-pipeline-dist/online/" \
            --endpoint-url "https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --region auto --delete --quiet
