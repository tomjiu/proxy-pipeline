# ═══════════════════════════════════════════════════════════
#  Proxy Pipeline — 订阅模板
# ═══════════════════════════════════════════════════════════
#
#  本文件由 Proxy Pipeline Worker 自动合成：
#    [本模板：DNS / 分流规则 / 嗅探 / 规则集]
#         +
#    [你的节点：运行时注入]
#
#  模板来源：用户本地配置（已移除全部节点与凭据）
#  占位符：{{PROXY}} = 策略组入口名（Worker 注入）
#
#  ⚠️ 本文件不含任何节点信息或凭据
# ═══════════════════════════════════════════════════════════

mixed-port: 7897
allow-lan: true
mode: rule
log-level: info
unified-delay: true
tcp-concurrent: true
find-process-mode: strict

dns:
  enable: true
  listen: "127.0.0.1:5335"
  use-system-hosts: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver: [180.76.76.76, 182.254.118.118, 8.8.8.8, 180.184.2.2]

  # ⚠️ 代理服务器域名专用解析器 —— 【必须配，否则 REALITY 握手超时】
  #
  # fake-ip 模式下，节点域名（如 san.mingjiu.store）如果走 nameserver 解析，
  # 会被分到 fake-ip（198.18.x.x），导致连不上节点。
  #
  # 实测（2026-10-28）：
  #   · 不加 proxy-server-nameserver：
  #       Hysteria2 侥幸能用（UDP 走不同路径）
  #       VLESS REALITY 完全超时 —— 因为 servername=www.apple.com 与 fake-ip 冲突
  #   · 加上之后：
  #       Hy2 gstatic 423ms / Steam 1084ms  ✅
  #       Reality gstatic 1917ms / Steam 1929ms ✅
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 180.76.76.76
    - "https://doh.pub/dns-query"
    - "https://dns.alidns.com/dns-query"

  nameserver:
    [
      180.76.76.76,
      119.29.29.29,
      180.184.1.1,
      223.5.5.5,
      8.8.8.8,
      "https://223.6.6.6/dns-query#h3=true",
      "https://dns.alidns.com/dns-query",
      "https://cloudflare-dns.com/dns-query",
      "https://doh.pub/dns-query",
    ]
  fallback:
    [
      "https://000000.dns.nextdns.io/dns-query#h3=true",
      "https://dns.alidns.com/dns-query",
      "https://doh.pub/dns-query",
      "https://public.dns.iij.jp/dns-query",
      "https://101.101.101.101/dns-query",
      "https://208.67.220.220/dns-query",
      "tls://8.8.4.4",
      "tls://1.0.0.1:853",
      "https://cloudflare-dns.com/dns-query",
      "https://dns.google/dns-query",
    ]
  fallback-filter:
    {
      geoip: true,
      ipcidr: [240.0.0.0/4, 0.0.0.0/32, 127.0.0.1/32],
      domain:
        [
          "+.google.com",
          "+.facebook.com",
          "+.twitter.com",
          "+.youtube.com",
          "+.xn--ngstr-lra8j.com",
          "+.google.cn",
          "+.googleapis.cn",
          "+.googleapis.com",
          "+.gvt1.com",
        ],
    }
  fake-ip-filter:
    [
      # --- dsh / DeepSeek API: 必须走真实 DNS，否则 Node fetch 拿 fake-IP 连不上 ---
      "api.deepseek.com",
      "*.deepseek.com",
      "*.lan",
      "stun.*.*.*",
      "stun.*.*",
      time.windows.com,
      time.nist.gov,
      time.apple.com,
      time.asia.apple.com,
      "*.ntp.org.cn",
      "*.openwrt.pool.ntp.org",
      time1.cloud.tencent.com,
      time.ustc.edu.cn,
      pool.ntp.org,
      ntp.ubuntu.com,
      ntp.aliyun.com,
      ntp1.aliyun.com,
      ntp2.aliyun.com,
      ntp3.aliyun.com,
      ntp4.aliyun.com,
      ntp5.aliyun.com,
      ntp6.aliyun.com,
      ntp7.aliyun.com,
      time1.aliyun.com,
      time2.aliyun.com,
      time3.aliyun.com,
      time4.aliyun.com,
      time5.aliyun.com,
      time6.aliyun.com,
      time7.aliyun.com,
      "*.time.edu.cn",
      time1.apple.com,
      time2.apple.com,
      time3.apple.com,
      time4.apple.com,
      time5.apple.com,
      time6.apple.com,
      time7.apple.com,
      time1.google.com,
      time2.google.com,
      time3.google.com,
      time4.google.com,
      music.163.com,
      "*.music.163.com",
      "*.126.net",
      musicapi.taihe.com,
      music.taihe.com,
      songsearch.kugou.com,
      trackercdn.kugou.com,
      "*.kuwo.cn",
      api-jooxtt.sanook.com,
      api.joox.com,
      joox.com,
      y.qq.com,
      "*.y.qq.com",
      streamoc.music.tc.qq.com,
      mobileoc.music.tc.qq.com,
      isure.stream.qqmusic.qq.com,
      dl.stream.qqmusic.qq.com,
      aqqmusic.tc.qq.com,
      amobile.music.tc.qq.com,
      "*.xiami.com",
      "*.music.migu.cn",
      music.migu.cn,
      "*.msftconnecttest.com",
      "*.msftncsi.com",
      localhost.ptlogin2.qq.com,
      "*.*.*.srv.nintendo.net",
      "*.*.stun.playstation.net",
      "xbox.*.*.microsoft.com",
      "*.ipv6.microsoft.com",
      "*.*.xboxlive.com",
      speedtest.cros.wr.pvp.net,
    ]

profile:
  store-selected: true
  store-fake-ip: false

sniffer:
  enable: true
  parse-pure-ip: true
  sniff:
    HTTP: { ports: [80, 8080-8880], override-destination: true }
    QUIC: { ports: [443, 8443] }
    TLS: { ports: [443, 8443] }

