  - DOMAIN-SUFFIX,edu.kg,DIRECT
  - DOMAIN-SUFFIX,teamorouter.com,DIRECT
  - DOMAIN-SUFFIX,mofas.one,DIRECT
  - DOMAIN-SUFFIX,pp.ua,DIRECT
