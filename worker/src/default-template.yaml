  - DOMAIN-KEYWORD,steamcommunity,{{PROXY}}
  - DOMAIN-KEYWORD,steampowered,{{PROXY}}
  - DOMAIN-KEYWORD,steamstatic,{{PROXY}}

  # ── ③ Epic / GOG 等其他游戏平台商店（同样被墙）──
  - DOMAIN-SUFFIX,epicgames.com,{{PROXY}}
