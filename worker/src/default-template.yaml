  # ==========================================
  # 代理服务商面板 / 订阅站（直连）
  #
  # ⚠️ 为什么必须直连：
  #   这些站是给你【管理订阅、查看流量】用的。
  #   如果走代理访问，会形成「用代理去访问代理站」的绕路：
  #     · 慢（多一跳）
  #     · 流量算在你的订阅额度里
  #     · 节点挂了就连面板都打不开（无法自救）
  # ==========================================
  - DOMAIN-SUFFIX,akspeedy.com,DIRECT
  - DOMAIN-SUFFIX,mygo11.cc.cd,DIRECT
  - DOMAIN-SUFFIX,qzz.io,DIRECT

  # ==========================================
  # Steam 规则
  #
  #   原则：**除了「下载游戏」，其余全部走代理**
  #     · 游戏本体 / 更新包 / 创意工坊 下载 → 直连（国内有 CDN，更快）
  #     · 商店 / 社区 / 好友 / 聊天 / 静态资源 / 游戏服务器 → 代理
  #
  # ⚠️ 修复记录（2026-10-24）：
  #   之前把 steamstatic.com 错放在「下载直连」段：
  #     · store.steampowered.com 的 HTML 通过代理拿回来了
  #     · 但页面的 CSS/JS/图片来自 cdn.steamstatic.com，
  #       被 DOMAIN-SUFFIX,steamstatic.com,DIRECT 抢先匹配成直连
  #     · 直连加载失败 → 商店/社区页面白屏或报错
  #   而且后面的 DOMAIN-SUFFIX,cdn.steamstatic.com,{{PROXY}} 成了死规则。
  #
  #   steamstatic.com 属于「商店/社区网页资源」，不是游戏下载 →
  #   必须与商店保持一致走代理。
  # ==========================================

  # ── ① 游戏下载 CDN 直连（只放真正的下载域名）──
  - DOMAIN-SUFFIX,steamcontent.com,DIRECT
  - DOMAIN-SUFFIX,steamcontent.com.cn,DIRECT
  - DOMAIN-SUFFIX,steamcdn-a.akamaihd.net,DIRECT
  - DOMAIN-SUFFIX,steampipe.akamaized.net,DIRECT
  - DOMAIN-SUFFIX,steamcontent.tm,DIRECT
  - DOMAIN-SUFFIX,edge.steam-dns.top,DIRECT
  - DOMAIN-SUFFIX,csgo.wmsj.cn,DIRECT
  - DOMAIN-SUFFIX,dota2.wmsj.cn,DIRECT
  - DOMAIN-SUFFIX,dl.steam.clngaa.com,DIRECT
  - DOMAIN-SUFFIX,steam.apac.qtlglb.com,DIRECT
  - DOMAIN-SUFFIX,st.dl.eccdnx.com,DIRECT
  - DOMAIN-SUFFIX,st.dl.bscstorage.net,DIRECT
  - DOMAIN-KEYWORD,steamcontent,DIRECT

  # ── ② 商店 / 社区 / 静态资源 / 游戏服务器 → 代理 ──
  - DOMAIN-SUFFIX,steampowered.com,{{PROXY}}
  - DOMAIN-SUFFIX,steamcommunity.com,{{PROXY}}
  - DOMAIN-SUFFIX,steamstatic.com,{{PROXY}}
  - DOMAIN-SUFFIX,steamserver.net,{{PROXY}}
  - DOMAIN-SUFFIX,steamusercontent.com,{{PROXY}}
  - DOMAIN-SUFFIX,steam-chat.com,{{PROXY}}
