name = "proxy-pipeline-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# ── 环境变量（敏感值用 secrets，不要写这里）──
#   wrangler secret put ADMIN_PASSWORD
#   wrangler secret put SESSION_SECRET
[vars]
RAW_BASE = "https://raw.githubusercontent.com/tomjiu/proxy-pipeline/main/dist"

# ── KV 命名空间 ──
[[kv_namespaces]]
binding = "KV"
id = "9ac43463453d4b3f9c96daeb9d7288ed"

# ── R2（可选，未开通时忽略）──
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "proxy-pipeline-dist"
