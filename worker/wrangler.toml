name = "proxy-pipeline-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Set after you push the repo:
#   RAW_BASE = "https://raw.githubusercontent.com/<USER>/<REPO>/main/dist"
# Optional:
#   API_TOKEN = "change-me"

[vars]
RAW_BASE = "https://raw.githubusercontent.com/tomjiu/proxy-pipeline/main/dist"
# API_TOKEN = ""

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "proxy-pipeline-dist"
preview_bucket_name = "proxy-pipeline-dist"
