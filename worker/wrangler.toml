name = "proxy-pipeline-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# ═══════════════════════════════════════════════════════════
#  部署说明
# ═══════════════════════════════════════════════════════════
#
#  1. 创建 KV 命名空间
#       npx wrangler kv namespace create PROXY_KV
#     把输出里的 id 填到下面 [[kv_namespaces]]
#
#  2. 设置 secrets（不要写在文件里）
#       npx wrangler secret put ADMIN_PASSWORD     # 登录密码
#       npx wrangler secret put SESSION_SECRET     # Cookie 签名密钥
#       npx wrangler secret put TRAFFIC_SECRET     # 流量接口密钥（可选）
#
#  3. 部署
#       npx wrangler deploy
#
# ═══════════════════════════════════════════════════════════

[vars]
# 数据源（GitHub 仓库的 dist 目录，可通过 jsDelivr 回退）
RAW_BASE = "https://raw.githubusercontent.com/tomjiu/proxy-pipeline/main/dist"

# 流量统计接口（可选，不配则订阅不显示流量）
# TRAFFIC_API = "https://your-domain/api/traffic"

# 配额（字节）2.5TB 总量 / 1TB 每人；不配则用默认值
# QUOTA_TOTAL = "2748779069440"
# QUOTA_PER_USER = "1099511627776"

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_YOUR_KV_ID"

# ── R2（可选）──
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "proxy-pipeline-dist"
